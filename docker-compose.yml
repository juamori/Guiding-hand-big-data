# Airflow 3.0.6 local (LocalExecutor + PostgreSQL) para o pipeline Guiding Hand.
# Uso no Windows: scripts\windows\02_iniciar_airflow.ps1 (gera .env e sobe tudo).
# Interface: http://localhost:8080  (modo local de desenvolvimento, sem login)
x-airflow-comum: &airflow-comum
  image: apache/airflow:3.0.6-python3.12
  env_file: .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Sao_Paulo
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    PYTHONPATH: /opt/airflow/dags
  volumes:
    - ./dags:/opt/airflow/dags
    - ./chegada:/opt/airflow/chegada
    - ./logs_pipeline:/opt/airflow/logs_pipeline
    - ./logs:/opt/airflow/logs
    - ./airflow:/opt/airflow/config_gh
  user: "50000:0"
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow-comum
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/chegada /opt/airflow/logs_pipeline /opt/airflow/logs
        chown -R 50000:0 /opt/airflow/chegada /opt/airflow/logs_pipeline /opt/airflow/logs
        su airflow -s /bin/bash -c "airflow db migrate" &&
        if [ -f /opt/airflow/config_gh/variables.json ]; then
          su airflow -s /bin/bash -c "airflow variables import /opt/airflow/config_gh/variables.json"
        fi
        echo "Airflow inicializado."

  airflow-apiserver:
    <<: *airflow-comum
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 15s
      retries: 10
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-comum
    command: scheduler
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
      airflow-apiserver:            # tarefas dependem da Execution API: só sobe com o api-server saudável
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow-comum
    command: dag-processor
    restart: unless-stopped
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db:
